# Build automático - compila no GitHub e gera JARs pra download
name: build
on:
  push:
    branches:
      - master
      - main
      - arena/**
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v2

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: microsoft
          cache: gradle

      - name: Make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build all versions
        run: |
          ./gradlew chiseledBuild --stacktrace --no-daemon 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}
        env:
          GRADLE_OPTS: "-Xmx4g -Dorg.gradle.daemon=false"

      - name: List built JARs
        if: always()
        run: |
          echo "=== tail build.log ==="
          tail -n 1000 build.log || true
          echo "=== find jars ==="
          find build -type f -name "*.jar" 2>/dev/null | sort || echo "no jars"

      - name: Upload JARs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Locomotion-${{ github.sha }}
          path: |
            build/libs/**/*.jar
            !build/libs/**/*-dev*.jar
            !build/libs/**/*-sources*.jar
          if-no-files-found: error

      - name: Push log to ci-logs branch for debugging
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp build.log /tmp/build.log 2>/dev/null || echo "no build.log" > /tmp/build.log
          git checkout --orphan ci-logs-debug
          rm -rf $(ls -A | grep -v "^\.git$" || true) 2>/dev/null || true
          cp /tmp/build.log ./build.log
          echo "Run $GITHUB_RUN_ID SHA $GITHUB_SHA" > info.txt
          git add build.log info.txt
          git commit -m "log for $GITHUB_SHA run $GITHUB_RUN_ID" || true
          git push origin HEAD:ci-logs --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
