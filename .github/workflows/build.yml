# Build every supported loader/version on every push and pull request.
name: build

on: [pull_request, push]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        java: [21]
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: validate gradle wrapper
        uses: gradle/wrapper-validation-action@v1

      - name: setup jdk ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: microsoft

      - name: make gradle wrapper executable
        if: ${{ runner.os != 'Windows' }}
        run: chmod +x ./gradlew

      - name: build
        shell: bash
        run: |
          mkdir -p build/ci
          set -o pipefail
          ./gradlew chiseledBuild --stacktrace 2>&1 | tee build/ci/gradle.log

      - name: capture build artifacts
        if: ${{ runner.os == 'Linux' && matrix.java == 21 }}
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: build/libs/

      # Keep the complete Gradle output available when a runner reports only
      # the final exit code in the Actions UI.  This is especially useful for
      # javac and mixin errors in the versioned NeoForge source set.
      - name: capture build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.os }}
          path: build/ci/gradle.log
          if-no-files-found: ignore

      - name: summarize build errors
        if: failure()
        shell: bash
        run: |
          {
            echo '## Gradle diagnostics'
            echo
            echo '```text'
            grep -E '(^|/)(error:|FAILURE:|What went wrong|BUILD FAILED|Execution failed)' build/ci/gradle.log | tail -200 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # A failed Actions log is served from a short-lived Azure URL that is
      # not available in every API environment.  Keep a temporary copy in the
      # session branch so the complete compiler diagnostics can be inspected.
      - name: publish failure log for diagnosis
        if: ${{ failure() && runner.os == 'Linux' && github.event_name == 'push' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .ci
          cp build/ci/gradle.log .ci/last-build.log
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .ci/last-build.log
          git commit -m "ci: publish failed build log [skip ci]" || exit 0
          git push origin "HEAD:${GITHUB_REF_NAME}"
